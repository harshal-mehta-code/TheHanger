      <stop offset="0" stop-color="#efe8e0"/>
      <stop offset="1" stop-color="#d6cdc1"/>
    </linearGradient>
    <linearGradient id="cloth-pearl-studs" x1="0.15" y1="0" x2="0.85" y2="1">
